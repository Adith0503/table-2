<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responsive Student Table</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f5f5;
    }

    h2 {
        text-align: center;
        color: #333;
        animation: fadeIn 2s ease-in-out;
    }

    /* Animation */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: white;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    th, td {
        border: 2px solid #e4c000;
        padding: 12px;
        text-align: center;
    }

    th {
        background: #fff8c4;
        font-weight: bold;
    }

    /* Hover effect */
    tr:hover {
        background: #fffae6;
        transition: 0.3s;
    }

    /* MOBILE VIEW (show only first 2 columns) */
    @media only screen and (max-width: 600px) {
        td:nth-child(n+3),
        th:nth-child(n+3) {
            display: none;
        }
    }
</style>
</head>

<body>

<h2>Student Information Table</h2>

<table>
    <tr>
        <th>Number</th>
        <th>Full Name</th>
        <th>Course</th>
        <th>Student ID</th>
        <th>Year</th>
    </tr>

    <tr><td>1</td><td> adith kuttappan</td><td>computer system </td><td>01 </td><td>2024 </td></tr>
    <tr><td>2</td><td>achu </td><td>computer syste </td><td>02 </td><td> 2024</td></tr>
    <tr><td>3</td><td>edwin </td><td>computer system </td><td>03 </td><td>2024 </td></tr>
    <tr><td>4</td><td>arjun </td><td>computer system </td><td>04 </td><td>2024 </td></tr>
    <tr><td>5</td><td>karthik </td><td>computer system </td><td>05 </td><td>2024 </td></tr>

</table>

</body>
</html>
